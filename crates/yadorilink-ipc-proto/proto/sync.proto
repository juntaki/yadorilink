syntax = "proto3";
package yadorilink.sync.v1;

// Peer-to-peer sync protocol exchanged directly between devices over a
// `yadorilink-transport::QuicPeerChannel` (one long-lived, mutually
// authenticated QUIC stream, not gRPC — only the coordination plane uses
// gRPC; peer sync traffic rides the QUIC-encrypted control stream
// established per session). Every message exchanged between two
// syncing devices is one prost-encoded `SyncMessage`.

// Per-payload wire encoding for selected sync payloads, chosen by the
// sender for that one payload (e.g. raw when compression would inflate a
// block) -- not a peer capability. `COMPRESSION_NONE` is the proto3
// zero-value.
enum Compression {
  COMPRESSION_NONE = 0;
  COMPRESSION_ZSTD = 1;
}

message ClusterConfig {
  // Fields 1-2 were `repeated string folder_group_ids` and
  // `repeated string known_peer_device_ids`. Advertised outbound but never
  // consumed by any receiving-side handler -- removed rather than carried
  // as unused wire weight.
  reserved 1, 2;
  reserved "folder_group_ids", "known_peer_device_ids";
  // Field 3 was `repeated Compression supported_compression`, advertising
  // which wire compressions this peer could receive. Compression is no
  // longer negotiated: both ends of a connection are the same protocol
  // generation by the time either can send anything (the generation rides
  // the ALPN and a mismatch is refused during the TLS handshake), so there
  // is no peer that might not understand `COMPRESSION_ZSTD`. The
  // `Compression` enum itself stays -- a sender still chooses raw when
  // compressing a payload would inflate it, which is a per-payload
  // optimization, not a per-peer capability.
  reserved 3;
  reserved "supported_compression";
  // Field 4 was `bool supports_encrypted_storage_peer`, removed together
  // with the untrusted ciphertext-only peer kind and its encrypted-index
  // path. Every peer exchanges plaintext records/blocks over the
  // transport's own encryption.
  reserved 4;
  reserved "supports_encrypted_storage_peer";
  // Field 5 was `supports_reliable_delivery`, advertising the previous
  // transport's optional seq/ack framing. Reliability is not optional and
  // is not negotiated under QUIC, so the field has no meaning; the number
  // is not reused.
  reserved 5;
  reserved "supports_reliable_delivery";
  // True once this
  // device has itself received a `ClusterConfig` from the peer this
  // message is addressed to. This is a genuine bidirectional-delivery
  // confirmation, NOT the same thing as "I received something from the
  // peer" alone: a device that has received from its peer sets this
  // `true` on every `ClusterConfig` it sends afterward, so the peer can
  // tell, from this flag, that *its own* earlier advertisement actually
  // arrived. Receiving from a peer proves nothing about whether that
  // peer received from *you* — under asymmetric datagram loss (one
  // direction healthy, the other persistently dropped), a stop condition
  // based only on "I received something" lets the broken direction's
  // sender give up immediately, exactly defeating the retry loop this
  // field supports (see `peer_session.rs`'s `spawn_cluster_config_retry`
  // and `peer_acked_my_cluster_config`).
  bool acked_peer_cluster_config = 6;
  // Fields 7-9 were `supports_change_dag`, `supports_version_present` and
  // `supports_version_hash_exact`. All three were capability bits that no
  // two peers able to reach a running session could ever disagree on:
  // every build set them identically, and the handshake that read them
  // required all three anyway, so a peer that lacked one was refused
  // rather than served differently. They were removed with the negotiation
  // machinery around them once the ALPN became the only definition of the
  // protocol generation -- a peer that does not speak the change DAG, the
  // custody query, or the exact-version check is a peer of a different
  // generation, and is refused during the TLS handshake instead of being
  // discovered one capability at a time afterwards.
  reserved 7, 8, 9;
  reserved "supports_change_dag", "supports_version_present",
           "supports_version_hash_exact";
  // Was `bool supports_block_serve_credit` -- the credit-gated block
  // serving path is no longer negotiated; every peer that reaches a
  // session is required to use it. The legacy `BlockResponse` message
  // this flag used to gate falling back to is removed entirely, not
  // merely unused.
  reserved 10;
  reserved "supports_block_serve_credit";
  // The following two fields piggyback on `ClusterConfig`'s existing
  // periodic re-announce (no separate advertisement message), and are the
  // reason this message still exists at all: unlike the capability bits
  // above, they are genuinely dynamic and can differ between two peers of
  // the same generation, and between one moment and the next. The
  // receiving-side preflight refuses a handshake if either is 0 (an
  // unusable peer), which is the only thing either currently gates.
  //
  // The most in-flight *request count* this peer's serve engine is willing
  // to admit from all requesters combined right now.
  uint32 max_inflight_requests = 11;
  // The most in-flight *bytes* this peer's serve engine is willing to admit
  // from all requesters combined right now (a global bound).
  uint64 max_inflight_bytes = 12;
  // Fields 13-14 were `available_worker_slots`/`estimated_queue_delay_ms`,
  // advisory serve-load hints. Advertised outbound but never consumed by
  // any receiving-side handler -- removed rather than carried as unused
  // wire weight. If real source-selection load balancing is ever built, it
  // gets a deliberate wire representation in the generation that adds it.
  reserved 13, 14;
  reserved "available_worker_slots", "estimated_queue_delay_ms";
  // Field 15 was `uint32 protocol_version`, this device's protocol
  // generation. It was the second definition of a number the ALPN already
  // defines, and the two would eventually have disagreed: a generation
  // check that runs after the handshake can only refuse a peer that has
  // already been let in far enough to send an application message, while
  // the ALPN refuses it inside the TLS handshake, before any application
  // frame exists. See `yadorilink_transport::quic_identity::
  // YADORILINK_P2P_ALPN`, which now carries the obligation this field
  // used to share: it moves whenever the peer wire changes.
  reserved 15;
  reserved "protocol_version";
}

// The first message on a block stream, sent by the requester.
//
// One block request is one bidirectional QUIC stream, so this carries no
// correlation id: the response arrives on the stream the request went out
// on, and nothing else does. The `request_id` this used to carry existed
// only because several requests and their answers shared one byte stream.
message BlockRequestHeader {
  string folder_group_id = 1;
  string file_path = 2;
  // The plaintext content hash of the requested block.
  bytes block_hash = 3;
}

// The block bytes follow this response on the same stream: exactly `size`
// raw bytes, then FIN. `size` is what is actually on the wire, so it is the
// post-compression length when `compression` is not `COMPRESSION_NONE`.
message BlockFound {
  uint64 size = 1;
  // The block's plaintext content hash, echoed from the request. The
  // requester already knows it, so this is a cross-check rather than
  // information: a response bound to a different hash than the one asked
  // for is rejected rather than stored.
  bytes hash = 2;
  // How `size` bytes of body are encoded. Not a negotiated capability --
  // both ends of a connection are the same generation, so both understand
  // every value here. A sender still picks `COMPRESSION_NONE` for a block
  // that compression would inflate.
  Compression compression = 3;
}

// This peer's serve queue for the requested block is at its in-flight
// credit limit (per-peer, per-group, or global) right now, not permanently
// absent. The requester must retry no sooner than `retry_after_ms` rather
// than treating this as `dont_have` or a timeout.
message BlockBusy {
  uint32 retry_after_ms = 1;
  // How many requests are currently ahead of a hypothetical new one in this
  // peer's serve queue, for the requester's own source-selection judgment.
  uint32 queue_depth = 2;
}

// The request itself could not be honored for a reason other than
// not-having-it or being-busy (e.g. the requester is not authorized for the
// group, or the request was structurally malformed) -- distinct from
// `dont_have` so a requester does not mistake a hard rejection for "keep
// retrying, it might show up."
message BlockRejected {
  string reason = 1;
}

// The second message on a block stream, sent by the responder.
//
// The admission-control outcomes are exactly the ones the previous inline
// reply carried; what changed is where they are carried, not what they
// mean. A same-generation peer always sets exactly one of these -- an
// absent `outcome` is malformed for this generation, not a legitimate
// forward-incompatible case, and is rejected at decode time rather than
// treated as `dont_have`.
message BlockResponseHeader {
  // Field 4 was the `redirect` oneof case (`BlockRedirect`) -- steering a
  // requester toward another peer believed to hold the block. No production
  // code ever constructed one (the multi-peer hydration dispatcher that
  // would act on it was never built); removed rather than carried as a wire
  // case nothing sends. A real redirect mechanism, if built, gets a
  // deliberate wire representation in the generation that adds it.
  reserved 4;
  reserved "redirect";
  oneof outcome {
    BlockFound found = 1;
    // Set `true` when the responder has looked and genuinely does not
    // (and, unlike `BlockBusy`, is not merely temporarily unable to) hold
    // this block -- the requester should stop waiting on this peer for it.
    bool dont_have = 2;
    BlockBusy busy = 3;
    BlockRejected rejected = 5;
  }
}

// Change-history DAG exchange, the sole metadata-convergence path: the
// mtime index-exchange engine that once backed it up is gone, along with the
// `full_index`/`index_update` messages it ran on (reserved in `SyncMessage`
// below). The receiver diffs the announced heads against its own store, requests the hashes it is missing,
// walks the returned changes' parents, and repeats until closed — so the
// bytes moved are proportional to the divergence between the replicas, not
// to folder or total-history size.
//
// A change hash is the 32-byte SHA-256 of a change's canonical encoding; an
// encoded change is its canonical encoding followed by its 64-byte Ed25519
// signature (`yadorilink_replica_domain::change::Change::to_wire_bytes`), so a
// relayed change carries its original signature and cannot be forged or
// altered by an intermediary without detection at the receiver.

// Sent at session start and after every local commit: the sender's current
// DAG heads for a group.
message HeadsAnnounce {
  string folder_group_id = 1;
  repeated bytes heads = 2;        // each = 32-byte change hash
  // Field 3 was `frontier_hint`, an optional compaction bookkeeping hint --
  // advertised outbound but never consumed by any receiving-side handler.
  // Removed rather than carried as unused wire weight; checkpoint/pruned-
  // boundary anti-entropy, if built, gets a deliberate wire representation
  // in the generation that adds it.
  reserved 3;
  reserved "frontier_hint";
}

// A change request identifies both what the requester wants and what it
// already has, so the responder can compute the true missing delta
// (reachable(want_heads) minus the causal history reachable from
// have_heads) instead of the requester's full ancestor closure. `have_heads`
// is the requester's own current local heads for the group, read fresh when
// the request is built; it is untrusted input the responder must confirm it
// recognizes (a live change, or a provably-compacted checkpoint boundary)
// before letting it narrow the delta -- an unrecognized declared head must
// never cause the responder to withhold otherwise-owed history.
message ChangeRequest {
  string folder_group_id = 1;
  repeated bytes want_heads = 2;   // each = 32-byte change hash
  repeated bytes have_heads = 3;   // each = 32-byte change hash
}

// A bounded, oldest-first batch of encoded changes answering a
// `ChangeRequest`. Oldest-first so a receiver's ancestry completes as it
// applies the batch, keeping orphaning the exception rather than the rule.
// Bounded like today's index batches. A single `ChangeRequest` may be
// answered by several `ChangeBatch` messages in sequence, computed once
// against the request's own delta and split into pages purely to bound
// message size -- `more` is true on every page but the last.
message ChangeBatch {
  string folder_group_id = 1;
  // Each entry is one change's `to_wire_bytes` encoding (canonical bytes +
  // 64-byte signature).
  repeated bytes changes = 2;
  // Fields 3-4 were `Compression compression` and `bytes
  // compressed_changes` -- the one production sender always sends
  // uncompressed. Removed rather than carried as an unused wire case;
  // change-stream compression, if it turns out to be worth it, gets a
  // deliberate wire representation in the generation that adds it.
  reserved 3, 4;
  reserved "compression", "compressed_changes";
  // The canonical encodings of every file version referenced by the ops in
  // this batch's `changes` (a create/update/move op carries only a version's
  // content hash, not its block list). Each entry is one version's
  // `yadorilink_replica_domain::file::FileVersion::canonical_encoding`, whose
  // SHA-256 is that version's hash — so a receiver re-derives and verifies the
  // hash on arrival and a tampered version simply fails to match the hash any
  // op references. Deduplicated within the batch and always sent uncompressed
  // (versions are small relative to the block content they describe); a
  // receiver stores these before admitting any change so a surviving-content
  // path can be materialized from the version's block list.
  repeated bytes file_versions = 5;
  // Whether at least one further `ChangeBatch` answering the same
  // `ChangeRequest` follows this one. `false` means this is the final page.
  bool more = 6;
}

// An on-demand device asks a full replica whether it durably holds an exact
// file version, so the on-demand device may reclaim its own cached copy only
// when a full replica confirms it holds that exact version. The version is
// identified by `version_hash` — the change-DAG's own `change::VersionHash`
// (SHA-256 of the canonical `FileVersion` encoding: the ordered block list
// with each block's size, the total size, and the version's metadata — mtime,
// exec bit, symlink target, record kind). That hash is the PRIMARY binding:
// the responder recomputes it from its own index record and answers present
// only on an exact match, never on a bare block-hash coincidence, so the
// answer is bound to precisely this content-and-metadata identity, not a
// causal "has the change" that a superseded version's blocks may no longer
// back after retention/GC. `block_hashes`/`block_sizes` (parallel arrays, in
// file-byte order) restate the same version's block list explicitly, so the
// responder can run its own block/size comparison and its per-block `get()`
// checksum-verification loop without a second round trip. `request_id`
// correlates the asynchronous reply. Peer-to-peer only; the coordination
// plane never sees this.
message VersionPresentQuery {
  uint64 request_id = 1;
  string folder_group_id = 2;
  string file_path = 3;
  repeated bytes block_hashes = 4;   // each = 32-byte SHA-256 block hash, in file-byte order
  // What the querier is trying to prove, which changes which of the
  // responder's own versions may satisfy the query:
  //   false (default, per-file eviction custody): the queried version must
  //     match the responder's CURRENT record for the path. An on-demand
  //     device asking "may I drop my last cached copy of this file's current
  //     version?" must only be told yes by a full replica whose *current*
  //     version is that exact content -- a match against a merely retained
  //     (superseded/trashed) version is unsafe, because that retained row
  //     can expire under version retention and be reclaimed, after which the
  //     device that already dropped its cache would have no holder left.
  //   true (whole-group durability handoff): the queried version may match
  //     ANY version the responder still retains at the path -- current,
  //     superseded, or trashed. A handoff must confirm the peer covers every
  //     durability root of the group, including retained history, not only
  //     current heads.
  bool for_handoff = 5;
  // The queried version's `change::VersionHash` — 32-byte SHA-256 of its
  // canonical `FileVersion` encoding. This is the exact-version identifier
  // the responder recomputes and compares against, not `block_hashes` alone:
  // two versions can share every block hash while differing in size, mtime,
  // exec bit, symlink target, or record kind, and `version_hash` is what
  // makes those distinct identities. The responder rejects any value that
  // is not exactly 32 bytes (fail closed, never misidentified).
  bytes version_hash = 6;
  // Each block's declared byte size, parallel to `block_hashes` (same index,
  // same order) — lets the responder run an explicit block/size comparison
  // against its own record in addition to the `version_hash` match, even
  // though the outcome is already implied by that hash (size is one of its
  // hashed inputs).
  repeated uint32 block_sizes = 7;
}

// A full replica's answer to a `VersionPresentQuery`: whether it durably holds
// every queried block. The answer is trusted because it arrives over the
// authenticated peer channel from a device the netmap currently authorizes as a
// full-replica member of the group, and the querier re-verifies that
// authorization — and that its membership view is unchanged — after the reply,
// rather than via a signature.
message VersionPresentAck {
  uint64 request_id = 1;
  // Fields 2-3 were `folder_group_id`/`file_path`, echoed back but never
  // read by the querier (which already knows what it asked). Field 5 was
  // `signature`, reserved for a future signed attestation and always sent
  // empty. All three removed rather than carried as unused wire weight; a
  // signed attestation, if ever required, gets a deliberate wire
  // representation in the generation that adds it.
  reserved 2, 3, 5;
  reserved "folder_group_id", "file_path", "signature";
  bool present = 4;                  // true only if every queried block is durably present
}

// A source device, about to give up its own full-replica role (unlink or
// demote), asks a specific already-confirmed target peer to verify and pin
// its own durability-root set and hand back a coordination-plane lease
// naming that peer — so the source's role-loss commit can present a live
// lease rather than relying on the eligibility guard alone. Sent only to a
// peer the source has already confirmed (via the `VersionPresentQuery`/
// `VersionPresentAck` whole-group durability handoff) holds every root the
// source itself holds. `request_id` correlates the asynchronous reply.
// Peer-to-peer only, over the authenticated channel; the coordination plane
// is contacted separately, by the RESPONDER, and never sees this message or
// `HandoffLeaseGrant` below.
message HandoffLeaseRequest {
  uint64 request_id = 1;
  string folder_group_id = 2;
}

// The target's answer to a `HandoffLeaseRequest`: whether it could verify
// and pin its own durability-root set for the group and obtain a
// coordination-plane lease naming it as the confirmed target, plus the
// digest of exactly the root set it attested and pinned. The source compares
// this against its own local digest itself, daemon-local only — this digest
// is never sent to, or read back from, the coordination plane; it is
// exchanged directly between the two peers here and nowhere else.
// `granted = false` (or an empty `lease_id`) means the target could not
// obtain a live lease this round (not yet caught up with the source's exact
// root set, the target's own coordination-plane request failed, etc.) — the
// source must treat this exactly like a timeout: do not relinquish its role.
message HandoffLeaseGrant {
  uint64 request_id = 1;
  bool granted = 2;
  string lease_id = 3;
  // The target's own durability-roots digest: the same 32-byte SHA-256 that
  // the source's own readiness check computes, over the sorted
  // (path, change::VersionHash) set of every durability root it retains.
  // Empty when `granted = false`.
  bytes root_digest = 4;
  int64 expires_at_unix = 5;
}

// Best-effort cancellation of a lease already granted to the requesting
// source. Used when the source can identify the lease but cannot use it
// (for example, its digest does not match the target's attestation).
// Carries ids only; the target owns both the local pin and Worker lease.
message HandoffLeaseRelease {
  // Field 1 was `request_id` -- this message is fire-and-forget (no reply
  // is expected or correlated), so the id was set on send but never read.
  reserved 1;
  reserved "request_id";
  string folder_group_id = 2;
  string lease_id = 3;
}

// A device about to lose access to a folder group entirely (revoke/
// device-remove of THIS device by a DIFFERENT device, not this device
// giving up its own role voluntarily) asks a specific already-confirmed
// peer to verify and pin ITS OWN durability-root set and hand back a
// coordination-plane lease -- the removed-device "ticket" the operating
// device (X) presents so a cross-device removal can proceed without
// assuming the risk of permanently losing history only the removed device
// (B) held. This is the same verify+pin+lease exchange as
// `HandoffLeaseRequest`/`HandoffLeaseGrant` above, run by B against a peer
// that holds B's own root set -- but triggered by a DIFFERENT peer (X, the
// operating device) asking B to run it, kept as its own message pair
// rather than reusing `HandoffLeaseRequest` directly because the trigger
// and trust relationship are distinct: `HandoffLeaseRequest` only ever
// flows from a source about to relinquish its OWN role to an
// already-confirmed target, while this flows from the operating device to
// the device actually being removed, asking it to attest itself -- an
// operation with no equivalent in the ordinary handoff. `request_id`
// correlates the asynchronous reply. Peer-to-peer only, over the
// authenticated channel.
message HandoffTicketRequest {
  uint64 request_id = 1;
  string folder_group_id = 2;
}

// B's answer to a `HandoffTicketRequest`: whether it could verify and pin
// its own durability-root set for the group at some other confirmed peer
// and obtain a coordination-plane lease for it. X trusts `granted` as B's
// authenticated attestation over this session -- the same trust model
// every other peer-session message here already uses -- and does not need
// or compare a root digest (unlike `HandoffLeaseGrant`): B is the sole
// authority on its own roots, and the whole point of this exchange is that
// X cannot attest them itself. `lease_id`/`target_device_id`/
// `expires_at_unix` are empty/zero when B's root set was empty (vacuously
// ready -- nothing to hand off) or when `granted = false`. Unlike
// `lease_id`/`expires_at_unix` (carried only for X to record/log),
// `target_device_id` -- the confirming peer C that B pinned its roots
// at -- is REQUIRED input to X's own removal: X presents `(lease_id,
// target_device_id)` together to the coordination plane's lease-guarded
// role-loss commit so the commit can atomically re-verify the lease is
// still live for that exact `(group, target)` pair at the moment B is
// actually removed, closing the time-of-check/time-of-use gap between
// obtaining this ticket and performing the removal.
message HandoffTicketGrant {
  uint64 request_id = 1;
  bool granted = 2;
  string lease_id = 3;
  int64 expires_at_unix = 4;
  string target_device_id = 5;
}


// Cancels a removed-device ticket that the operating device obtained but
// will not consume. The removed device forwards an id-only lease release to
// the target that owns the pin; no reply is required because TTL remains the
// fail-safe when either peer is no longer reachable.
message HandoffTicketRelease {
  // Field 1 was `request_id` -- same rationale as `HandoffLeaseRelease`'s
  // own removal: fire-and-forget, set on send but never read.
  reserved 1;
  reserved "request_id";
  string folder_group_id = 2;
  string target_device_id = 3;
  string lease_id = 4;
}

// A device asks a peer for a re-bootstrap snapshot proving it intentionally
// pruned `requested_hash` -- sent when this device's own retained head
// cannot reach the peer's advertised frontier through ordinary incremental
// sync, the signal that ordinary `ChangeRequest`/`ChangeBatch` sync can no
// longer converge and a HistoryBase re-bootstrap is needed instead.
// `request_id` correlates the asynchronous reply.
message RebootstrapSnapshotRequest {
  uint64 request_id = 1;
  string folder_group_id = 2;
  bytes requested_hash = 3;
}

// The peer's answer to a `RebootstrapSnapshotRequest`: a signed
// `RebootstrapRequired` (encoded via
// `yadorilink_sync_core::rebootstrap::RebootstrapRequired::canonical_encoding`,
// decoded and verified with `RebootstrapRequired::decode`/`verify` before
// anything in it is trusted) bound to the exact `requested_hash`, plus the
// snapshot bytes it proves via `manifest.checkpoint.snapshot_hash`.
// `granted = false` (or an empty `required_encoded`) means the peer has no
// local evidence it pruned that hash -- the requester must treat this
// exactly like the unknown-vs-pruned boundary `prepare_rebootstrap_required`
// already preserves locally, and like a timeout.
message RebootstrapSnapshotResponse {
  uint64 request_id = 1;
  bool granted = 2;
  bytes required_encoded = 3;
  bytes snapshot_bytes = 4;
}

// M3 Pass 5: opens a relay session with the receiving device acting as
// relay ("B" in the feature's own design) between `source_device_id`
// ("A", which MUST be the device authenticated on the channel this
// message arrives on -- see `relay_session::admit_relay_open`'s own doc
// comment) and `destination_device_id` ("C"). Every field mirrors
// `relay_grant::RelayGrant` exactly -- this message IS a serialized
// grant, nothing more; the receiving device independently re-verifies
// every one of these fields against its own live state before opening
// anything (a validly-signed grant is necessary, never sufficient).
message RelayOpen {
  uint32 version = 1;
  string grant_id = 2;
  string group_id = 3;
  string source_device_id = 4;
  string relay_device_id = 5;
  string destination_device_id = 6;
  int64 not_before_unix = 7;
  int64 expires_at_unix = 8;
  // 0 means "no plane-issued cap" (`RelayGrant.max_session_bytes: None`).
  uint64 max_session_bytes = 9;
  bytes signature = 10;
}

// The relay's answer to `RelayOpen`: either a locally-assigned
// `session_id` (opaque to the requester, scoped to THIS relay device and
// THIS one grant_id -- never reused across sessions, never meaningful to
// any other relay) that `RelayData`/`RelayClose` on this same channel
// must echo back, or a rejection. `granted = false` covers every
// admission failure `relay_session::RelayAdmissionError` can produce --
// deliberately not distinguishing which check failed on the wire (a
// stolen-grant attempt and a genuinely-expired grant should look
// identical to whoever is presenting it; the distinguishing detail is
// this device's own local log, not something to hand back to the
// requester).
message RelayOpened {
  string grant_id = 1;
  bool granted = 2;
  uint64 session_id = 3;
}

// One opaque, already-QUIC-encrypted datagram, carried between A and
// the relay's own direct channel to C. The relay never parses, inspects,
// or modifies `payload` -- it is exactly the bytes one side's QUIC
// connection would otherwise have sent directly to the other over raw UDP.
// `session_id` is the value `RelayOpened` returned; a relay receiving a
// `session_id` it does not recognize (never granted, or already closed)
// silently drops the datagram rather than replying with any signal an
// attacker probing for valid session ids could use.
message RelayData {
  uint64 session_id = 1;
  bytes payload = 2;
}

// Ends a relay session before its grant's own `expires_at_unix` --
// sent by either side (the requester giving up, or the relay itself on
// idle timeout, resource pressure, or grant expiry). `reason` is a
// short, stable slug (e.g. "idle_timeout", "grant_expired",
// "byte_limit_reached", "requester_closed") for diagnostics only, never
// parsed by the receiving side.
message RelayClose {
  uint64 session_id = 1;
  string reason = 2;
}

message SyncMessage {
  // Fields 2-3 were `Index full_index` and `IndexUpdate index_update` (the
  // `oneof` cases below), removed with the mtime index-convergence engine
  // they drove; the change DAG (`heads_announce`/`change_request`/
  // `change_batch`) is the sole convergence authority.
  reserved 2, 3;
  reserved "full_index", "index_update";
  // Field 6 was `PresenceSignal presence` (the `oneof` case below), removed
  // with the edit-presence-awareness capability.
  reserved 6;
  reserved "presence";
  // Fields 7-9 were `encrypted_full_index`, `encrypted_index_update`, and
  // `wrapped_group_key`, removed together with the untrusted
  // ciphertext-only peer kind.
  reserved 7, 8, 9;
  reserved "encrypted_full_index", "encrypted_index_update", "wrapped_group_key";
  // Field 5 was `BlockResponse block_response`, and fields 4 and 23 were
  // `BlockRequest block_request` and `BlockReply block_reply`. No block
  // traffic rides the control stream any more: one block request is one
  // bidirectional stream, carrying a `BlockRequestHeader`, a
  // `BlockResponseHeader` and then the block's raw bytes (see those
  // messages above). None of the three numbers is reused.
  reserved 4, 5, 23;
  reserved "block_request", "block_response", "block_reply";
  oneof payload {
    ClusterConfig cluster_config = 1;
    HeadsAnnounce heads_announce = 10;
    ChangeRequest change_request = 11;
    ChangeBatch change_batch = 12;
    VersionPresentQuery version_present_query = 13;
    VersionPresentAck version_present_ack = 14;
    HandoffLeaseRequest handoff_lease_request = 15;
    HandoffLeaseGrant handoff_lease_grant = 16;
    HandoffTicketRequest handoff_ticket_request = 17;
    HandoffTicketGrant handoff_ticket_grant = 18;
    HandoffLeaseRelease handoff_lease_release = 19;
    HandoffTicketRelease handoff_ticket_release = 20;
    RebootstrapSnapshotRequest rebootstrap_snapshot_request = 21;
    RebootstrapSnapshotResponse rebootstrap_snapshot_response = 22;
    RelayOpen relay_open = 24;
    RelayOpened relay_opened = 25;
    RelayData relay_data = 26;
    RelayClose relay_close = 27;
  }
}
