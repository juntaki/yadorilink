[package]
name = "yadorilink-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

# See yadorilink-local-storage/Cargo.toml's identical section for why.
[dependencies]
yadorilink-ipc-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
rand = "0.10.2"
hex = "0.4"
prost = "0.14.4"
if-addrs = "0.15"
zeroize = "1"
ed25519-dalek = "3"

# The production QUIC transport (`quic_socket.rs`). `quinn` 0.11.11 is
# already resolved in this workspace's Cargo.lock (pulled in transitively),
# so this pins the exact version already present rather than letting a
# range float independently. `rustls-ring` (not the default `platform-
# verifier`/`rustls-aws-lc-rs`) keeps this on the same `ring` crypto
# provider `rustls` 0.23.42 already resolves with elsewhere in this
# workspace, and avoids pulling in `aws-lc-rs`'s C/cmake build requirement.
# Available under simulation too, deliberately: `quic_socket.rs` runs the
# real quinn stack over the transport hub's own shimmed socket, so the
# simulator sees every datagram. Keeping quinn out of simulation builds would
# force a simulation-only fake QUIC, which is exactly what must not exist:
# a deterministic test that does not exercise the real transport proves
# nothing about it.
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Certificate generation for TLS handshake tests. `ring` crypto backend,
# matching the rest of this dependency set.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }

# Windows-only: tighten a freshly written private-key file's DACL to the
# current user with inheritance disabled (the practical equivalent of unix
# `0o600`, since a new file would otherwise inherit the parent directory's
# weaker ACL). Same crate/version the daemon uses for its named-pipe DACL.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# Everything below reaches for something the host operating system owns --
# a credential store, a router, a socket option no simulator models. Under
# simulation that is both meaningless and a source of nondeterminism, so the
# simulation build gets none of these.
[target.'cfg(not(turmoil))'.dependencies]
# OS-native credential store (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) for storing device private keys at rest, the same crate
# and native backends the coordination-token store uses. Kept out of
# simulation builds so they never reach for a real OS keychain and stay
# deterministic; the on-disk hardened-file fallback is used there instead.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
# Socket construction only: bind the IPv6 half of the dual-stack endpoint
# v6-only on the same port as the IPv4 half. Not used under simulation (both
# simulators provide a single shimmed socket), so it stays out of them.
socket2 = "0.6"

# The simulated socket itself. A normal dependency rather than a
# dev-dependency because the swap happens in this crate's own `sim_net`
# module, on the production path — but only ever under `--cfg turmoil`,
# which no shipped build and no ordinary `cargo test` sets.
[target.'cfg(turmoil)'.dependencies]
turmoil = "0.7.2"

[lints]
workspace = true
