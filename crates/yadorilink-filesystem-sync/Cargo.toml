[package]
name = "yadorilink-filesystem-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Same shape as every other test-support feature in this workspace (e.g.
# Deliberately does NOT forward to `yadorilink-replica-engine/test-support`
# -- see `evict-custody-test-bypass` below. Bundling that forward into this
# feature used to mean every consumer of `test-support` (including
# `yadorilink-daemon`/`yadorilink-cli`, which need it only for the doubles
# above) silently got the confirmed-custody deletion bypass too, defeating
# their own tests' fails-closed-without-a-durable-lease assertions.
test-support = []

# Forwards to `yadorilink-replica-engine`'s own identically-named feature:
# `materialization_eviction::evict_file`'s `cfg(any(test, feature =
# "evict-custody-test-bypass"))` branch calls that crate's
# `verify_reclaim_custody_for_test`, which is itself gated `cfg(any(test,
# feature = "test-support"))` on that crate -- without this forward, a
# consumer that enables only this feature would unify it into `true` for
# the whole build graph while leaving `yadorilink-replica-engine`'s own
# feature off, so the function this branch calls would not exist in that
# build. A caller whose tests assert the opposite -- that an instantaneous
# confirmation without a durable remote lease must NOT authorize deletion
# (`yadorilink-daemon`'s
# `preflight_disk_pressure_runs_eviction_sweep_for_on_demand_link_first`/
# `eviction_without_remote_lease_never_reaches_physical_reclaim`) -- must
# NOT enable it, or its tests silently stop exercising the real,
# fails-closed `verify_reclaim_custody` path.
evict-custody-test-bypass = ["yadorilink-replica-engine/test-support"]

[dependencies]
yadorilink-root-authority = { path = "../yadorilink-root-authority" }
# `BlockReclamationStore`/`ContentHash`/`GcReport`/`StorageError` for
# `block_deletion::sweep_globally_unreferenced_blocks` (7D-9C) — a pure leaf
# dependency, same as `yadorilink-root-authority`'s own (this crate does not
# depend back on `yadorilink-filesystem-sync`, so no cycle risk).
yadorilink-local-storage = { path = "../yadorilink-local-storage" }
# The restore/eviction value types (`RestoreOperation`/`EvictableFile`,
# owned by `session_state`) and `materialization_execution.rs`'s
# `MaterializationExecutionPort` surface (7D-9C) -- already a transitive
# dependency via `yadorilink-local-storage`/`yadorilink-root-authority`, made
# direct now that this crate's own code names these types.
yadorilink-replica-domain = { path = "../yadorilink-replica-domain" }
# `MaterializationExecutionPort::reclaim_cached_blocks`'s `VerifiedCustody`
# parameter (7D-9C) -- a pure leaf crate over `yadorilink-replica-domain`
# only, so depending on it here carries no cycle risk (mirrors this crate's
# existing `yadorilink-local-storage` dependency's own reasoning).
yadorilink-replica-engine = { path = "../yadorilink-replica-engine" }
yadorilink-peer-session = { path = "../yadorilink-peer-session" }
thiserror.workspace = true
tracing.workspace = true
# `quarantine_dirty_disk_file`'s cheap on-disk `(size, mtime)` disambiguator
# (7D-9C, `materialization_repair.rs`) -- same version pin as every other
# workspace crate's `sha2` dependency.
sha2.workspace = true
hex = "0.4"
notify = "8"
walkdir = "2"
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
rand = "0.10.2"
yadorilink-replica-engine = { path = "../yadorilink-replica-engine", features = ["test-support"] }
# `materialization_repair.rs`'s own `#[cfg(test)]` module needs `create_
# or_defer_placeholder`'s Windows-deferred-outcome failure-injection seam
# (`set_test_force_deferred_placeholder`) to exercise its two placeholder
# arms' Windows-only handling on any host. Same override shape as the
# `yadorilink-replica-engine` entry just above.
yadorilink-local-storage = { path = "../yadorilink-local-storage", features = ["test-support"] }
tracing-subscriber.workspace = true
yadorilink-daemon = { path = "../yadorilink-daemon", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
