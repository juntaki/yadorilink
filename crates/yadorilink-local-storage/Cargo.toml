[package]
name = "yadorilink-local-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

# Registers `madsim` as a known cfg (set via `RUSTFLAGS="--cfg madsim"`
# for the deterministic-sim-testing test target only) so
# `#[cfg(madsim)]`/`#[cfg(not(madsim))]` in source don't trip clippy's
# `-D warnings` `unexpected_cfgs` lint during a normal (non-DST) build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }

[features]
# Exposes `materialize_write::set_test_force_deferred_placeholder`
# (normally `#[cfg(test)]`-only) to OTHER crates' test builds --
# `create_or_defer_placeholder`'s Windows-deferred branch is otherwise
# unreachable in a test built on a non-Windows host, so any consumer
# whose own tests need to exercise that branch's caller-side handling
# (e.g. `yadorilink-peer-session`, `yadorilink-filesystem-sync`) needs
# this, since `cfg(test)` alone is not active for an ordinary dependency
# of another crate's own test build. Same shape as every other
# test-support feature in this workspace.
test-support = []

[dependencies]
yadorilink-replica-domain = { path = "../yadorilink-replica-domain" }
# `fs_identity::bytes_to_target` for symlink-target byte<->OS-path
# conversion in `materialize_write::materialize_symlink*` (Phase 7D-6). A
# pure leaf crate over `yadorilink-replica-domain` only -- no cycle risk.
yadorilink-root-authority = { path = "../yadorilink-root-authority" }
thiserror.workspace = true
sha2.workspace = true
tracing.workspace = true
hex = "0.4"
# Content-defined chunking for `chunker::chunk_file_content_defined`
# (Phase 7D-8.1, moved from `yadorilink-sync-core`).
fastcdc = "5.0.0"
# Portable free-space queries
# (`available_space`/`total_space`) for the disk-headroom preflight check —
# no existing dependency in this crate (or anywhere else in the workspace,
# confirmed via search) exposed this; `std` has no stable cross-platform
# API for it.
fs2 = "0.4"
# `link_preflight.rs`'s directory-scan preflight (moved here from
# yadorilink-sync-core in Phase 7D-9B).
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

# `chunker::read_replicated_xattrs`'s raw `listxattr`/`getxattr` calls on
# Linux (C1.2a) -- already a workspace dependency elsewhere (e.g.
# yadorilink-filesystem-sync, yadorilink-root-authority), not a new one.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `chunker`'s CDC tests need pseudo-random content (real byte entropy
# matters for boundary-finding behavior, unlike the fixed-size tests).
rand = "0.10.2"

# See yadorilink-sync-core/Cargo.toml's identical section for why.
[target.'cfg(not(madsim))'.dependencies]
tokio.workspace = true

[target.'cfg(madsim)'.dependencies]
tokio = { version = "0.2", package = "madsim-tokio", features = ["full"] }
