[package]
name = "yadorilink-replica-domain"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately no tokio, no async, no filesystem/network -- this crate is
# the pure, synchronous domain model (identities, the signed canonical
# Change, file/version records, conflict policy) with nothing beneath it
# but the standard library and cryptography. The boundary is declared in
# `architecture.toml` and enforced by `scripts/check-architecture.py`.
[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
hex = "0.4"
ed25519-dalek = "3"
