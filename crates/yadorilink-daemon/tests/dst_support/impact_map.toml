# The reserved-artefact predicate sits on every path-consuming entry point --
# watcher ingestion and directory registration, the shared exclusion choke
# point used by both scan and event processing, DAG import, and admission --
# so a change here can alter what any scenario sees on disk or admits into
# history. Scoped to the scenarios that actually drive those paths.
reserved_namespace = [
    "dst_two_device_chaos",
    "dst_three_device_mesh_chaos",
    "dst_network_fault_chaos",
    "dst_directory_chaos",
    "dst_disk_crash_chaos",
    "dst_peer_reconcile_race",
    "dst_watcher_debounce",
]
# Modules with no DST scenario targeting them yet. Kept explicit so the lint
# proves the list is complete (not silently forgotten) and so the emptiness is
# itself a visible coverage gap an agent can pick up as a detection target.
# TODO(coverage): adaptive_window/chunker/hazard/
# rate_limiter/link_preflight have unit tests in `src/` but no DST scenario
# drives them through the simulated envelope.
# fs_identity/fs_capabilities are empty because nothing calls them yet: they
# are the identity/capability model for the filesystem transaction engine,
# exercised only by their own unit tests, with no production call site until
# a later phase wires the engine onto an actual caller. They must gain
# scenarios at that point -- an empty list here is a coverage gap, not a
# statement that they do not need coverage. (Both, plus fs_commit's real
# platform commit adapter, moved to yadorilink-filesystem-sync/
# yadorilink-root-authority in Phase 7D-9B -- this map covers sync-core's
# own remaining src/*.rs only.)
adaptive_window = []
fs_capabilities = []
fs_identity = []
# Records what the engine believes the disk currently reflects, as distinct
# from what the DAG resolves a path to. Empty for the same reason as the fs_*
# modules: nothing reads it yet. It gains scenarios when local change detection
# starts comparing against it instead of against the newest desired target,
# which is the behavioural switchover and is deliberately not done yet.
materialized_generation = []
# The transaction engine's journal: parent sagas, hierarchical path
# reservations and placement epochs. Empty for the same reason as the fs_*
# and materialized_generation modules, plus one more: every mutating entry
# point also sits behind its own disabled `EXECUTION_ENABLED` gate, so even a
# scenario that tried to reach it today would find nothing runs. It gains
# scenarios once a real caller exists and the gate is turned on.
filesystem_transaction = []
# Optimistic preparation and the short filesystem commit window built on top
# of filesystem_transaction/fs_commit/materialized_generation. Empty for the
# same reason as those modules: behind the same disabled `EXECUTION_ENABLED`
# gate, with no production caller yet, exercised only by its own unit tests.
optimistic_placement = []
# Early physical recovery (design §14.1), built on filesystem_transaction/
# fs_commit/fs_identity. Empty for the same reason as those modules: no
# daemon startup call site wires this in yet (filesystem_transaction's own
# `EXECUTION_ENABLED` gate has no bearing here -- this module deliberately
# bypasses it via the `_unchecked` entry points, since recovery must run even
# while forward execution is administratively disabled -- but there is
# simply no caller at daemon startup yet). Exercised only by its own unit
# tests, several of which drive a real filesystem commit through
# `fs_commit::NativeCommitAdapter`. It gains scenarios once startup wiring
# exists to actually crash mid-epoch under DST fault injection.
early_physical_recovery = []
# The plan/prepare/revalidate/replan loop (design §6) that drives
# `resolution_planning`'s slices through `orchestrator`. Empty for the same
# reason as every other module in this engine: it composes only gated
# primitives, its `PlanEnvironment` is implemented by its own tests alone,
# and no production caller builds one. It gains scenarios when the receiver-
# side environment exists and the gate opens -- at which point the scenarios
# to name here are the ones that move a path's winner while a projection is
# in flight, since that is the staleness this loop exists to detect.
plan_driver = []
# Custody transfer (design §8.1 `CustodyTransferred`, §12): moves a
# commit's displaced preimage into retained custody by same-filesystem
# rename. Empty for the same reason as the other filesystem-transaction-
# engine modules above: gated behind `filesystem_transaction::
# EXECUTION_ENABLED`, with no production caller yet, exercised only by its
# own unit tests (real filesystem rename/identity/hardlink/FIFO cases).
# No DST scenario drives the retained-preimage lifecycle yet: behind the
# same disabled `EXECUTION_ENABLED` gate as `custody_transfer`/
# `captured_authoring`, with no production caller wiring custody transfer
# or captured authoring into it yet, exercised only by its own unit tests.
retained_obligation = []
custody_transfer = []
# Durable planning: versioned resolution plans, bounded slices, multi-path/
# multi-epoch resolver placement and replanning on staleness -- built
# entirely on `filesystem_transaction`'s existing reservation and epoch
# machinery. Empty for the same reason as the other filesystem-transaction-
# engine modules above: gated behind `filesystem_transaction::
# EXECUTION_ENABLED`, with no production caller yet, exercised only by its
# own unit tests.
resolution_planning = []
# Phase 12 orchestrator: drives one resolution_planning::PlanSlice through
# allocation, one acquire_reservations call, every placement's commit
# window, release, then custody transfer/classify/author/retained
# obligation for whatever each placement displaced. Empty for the same
# reason as every other filesystem-transaction-engine module above:
# everything it composes sits behind the same disabled
# `filesystem_transaction::EXECUTION_ENABLED` gate, with no production
# caller yet (peer_session::materialize is not routed through it in this
# phase), exercised only by its own unit tests via the `_unchecked` seams.
# It gains scenarios once a real caller exists and the gate is turned on.
orchestrator = []
