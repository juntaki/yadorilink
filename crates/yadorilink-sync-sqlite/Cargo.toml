[package]
name = "yadorilink-sync-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

# See yadorilink-local-storage/Cargo.toml's identical section for why.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }

[features]
# Exposes test-only helpers to OTHER crates' test builds -- mirrors
# yadorilink-sync-core's own identical test-support feature and the
# reasoning documented there.
test-support = []

[dependencies]
yadorilink-sqlite-runtime = { path = "../yadorilink-sqlite-runtime" }
yadorilink-replica-domain = { path = "../yadorilink-replica-domain" }
yadorilink-replica-engine = { path = "../yadorilink-replica-engine" }
# `materialization_job_repository`'s `RootCommitPermit` gate on the
# `materialization_intents` crash-recovery journal writes -- this crate does
# not depend back on yadorilink-sync-core, so it takes the capability type
# directly from where it's defined. No cycle: yadorilink-root-authority only
# depends on yadorilink-replica-domain (already a dependency here).
yadorilink-root-authority = { path = "../yadorilink-root-authority" }
# `materialization_state::EvictableFile` (7D-9C) -- this crate does not
# depend back on `yadorilink-sync-sqlite`, so no cycle risk (mirrors this
# crate's existing `yadorilink-replica-engine` dependency's own reasoning).
# `commit_window.rs`'s own `#[cfg(test)]` module needs `FakeCommitAdapter`
# (`#[cfg(any(test, feature = "test-support"))]` in `yadorilink-filesystem-sync`)
# -- same reasoning as `yadorilink-sync-core`'s identical override for the
# same reason, before `commit_window.rs` moved here from that crate (7D-9D
# ninth pass).
yadorilink-filesystem-sync = { path = "../yadorilink-filesystem-sync", features = ["test-support"] }
# `captured_authoring::PreparedCapturedChange`'s `store: &dyn BlockStore`
# parameter (7D-9C) -- already a transitive dependency via
# `yadorilink-filesystem-sync`'s own use, so no cycle risk (mirrors this
# crate's existing `yadorilink-filesystem-sync` dependency's own reasoning).
yadorilink-local-storage = { path = "../yadorilink-local-storage" }
thiserror.workspace = true
tracing.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
serde.workspace = true
serde_json = "1"
hex = "0.4"
# `dag_store::causal_basis`'s content-addressed causal-basis-set hashing.
sha2 = "0.11"
# `filesystem_transaction::begin_transaction_unchecked`'s transaction-id
# generation -- same version pin as `yadorilink-sync-core`'s own use.
rand = "0.10.2"

# `MaterializationStatePort::path_lock`'s `Arc<tokio::sync::Mutex<()>>`
# return type (Phase 7D-10, relocated from yadorilink-sync-core) -- swapped
# for madsim's shim under the deterministic-simulation test binary, same
# split as every other crate that needs this (see
# yadorilink-root-authority/Cargo.toml's identical section).
[target.'cfg(not(madsim))'.dependencies]
tokio.workspace = true

[target.'cfg(madsim)'.dependencies]
tokio = { version = "0.2", package = "madsim-tokio", features = ["full"] }

[dev-dependencies]
tempfile = "3"
# `dag_store`'s own test fixtures sign changes directly (same version pin as
# `yadorilink-sync-core`'s production dependency).
ed25519-dalek = "2"
# Feature-unifies with the `[dependencies]` entry above to enable
# `RootCommitPermit::for_tests`/`RootLease::for_tests` for this crate's own
# `dag_store` test fixtures -- mirrors `yadorilink-sync-core`'s identical
# `yadorilink-root-authority/test-support` dev feature.
yadorilink-root-authority = { path = "../yadorilink-root-authority", features = ["test-support"] }
# `dag_store/mod.rs`'s own test module (`rejected_change_rolls_back_its_versions_and_
# grants_no_block_capability`, `dual_write_commits_index_row_and_change_together`, etc.)
# and `tests/dag_admission_order_fuzz.rs` exercise the DAG-store free
# functions through `yadorilink_daemon::replica_coordinator::
# ReplicaCoordinator`/`ChangeContent` as an integration-style fixture, not
# through this crate's own types (repointed off
# `yadorilink_sync_core::index::SyncState` in Phase 7D-10's final sync-core
# deletion pass) -- `dag_store` and `materialized_generation` (Phases
# 7D-7.3/7D-7.5) both moved into this crate already, so this dependency is
# no longer needed for schema-init helpers, only for this fixture reuse. No
# cycle: this is a dev-dependency, only compiled for this crate's own tests,
# never part of the production dependency graph (which already runs the
# other direction, daemon -> sync-sqlite). `test-support` IS needed here
# (unlike the pre-deletion `SyncState` fixture, which was never
# feature-gated): `ReplicaCoordinator::open_in_memory` is
# `#[cfg(any(test, feature = "test-support"))]` in `yadorilink-daemon`, and
# `cfg(test)` is crate-local the same way it is for the
# `yadorilink-root-authority` dev-dependency above.
yadorilink-daemon = { path = "../yadorilink-daemon", features = ["test-support"] }
