name: Coverage

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        run: cargo install --locked --version 0.8.7 cargo-llvm-cov
      - run: cargo llvm-cov clean --workspace
      - name: Workspace coverage
        # --no-fail-fast: surface every failing crate's tests in one run
        # rather than stopping at the first one, so a fix doesn't have to
        # be discovered and landed one crate at a time across repeated CI
        # round-trips.
        run: cargo llvm-cov --no-fail-fast --workspace --exclude yadorilink-daemon --exclude yadorilink-desktop-app --no-report
      - name: Daemon coverage (serial)
        # Deliberately WITHOUT --no-fail-fast: see ci-full.yml's own Daemon
        # E2E step for why -- the same serial multi-binary suite.
        run: |
          cargo llvm-cov -p yadorilink-daemon --tests --no-report -- \
            --test-threads=1 \
            --skip random_concurrent_operations_converge_to_an_identical_file_set \
            --skip replay_known_failing_seeds
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: true
