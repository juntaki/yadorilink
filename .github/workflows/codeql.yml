name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 7 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL's Rust extractor only supports build-mode `none` (source
      # analysis, no compilation) -- `manual`/`autobuild` both fail init
      # outright with "Rust does not support the manual build mode."
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
          build-mode: none
          # Test code deliberately prints credentials, tokens and fixed nonces
          # in assertion messages and fixtures, which the source-level queries
          # report as cleartext logging and hard-coded cryptographic values.
          # Every refactor that moves a test re-raises them as new alerts, so
          # scan production code only.
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/tests.rs"
              - "**/*_tests.rs"
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:rust"

  swift:
    # The FinderSync/FileProvider shell extension has no .xcodeproj (see
    # shell-ext/macos/YadoriLinkFinderSync/build.sh's header for why); its
    # embedded Rust core links via `swiftc` directly, so this needs the
    # same manual build as that script, on a real Xcode-equipped runner.
    runs-on: macos-latest
    # The FinderSync extension link (Rust staticlib + bridging header) is
    # the expensive step and finishes in ~10min; but the second, much
    # simpler swiftc invocation for the trivial host-app main.swift has
    # been observed hanging past 19min under CodeQL's DYLD_INSERT_LIBRARIES
    # tracer specifically (no such issue building outside CodeQL). Generous
    # timeout is a diagnostic, not a fix -- if this still doesn't complete,
    # the tracer/swiftc interaction needs its own investigation.
    timeout-minutes: 60
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          build-mode: manual
      - name: Build FinderSync host app + extension
        run: DEVELOPER_DIR="$(xcode-select -p)" ./shell-ext/macos/YadoriLinkFinderSync/build.sh
      # The tracer does reach the Swift extractor for both swiftc compiles (it
      # writes one diagnostics file per failing extraction), but finalize then
      # reports that nothing was extracted, and the failed-run SARIF it uploads
      # cannot be downloaded. Print what the extractor said, so a failure here
      # names its cause in the job log.
      - name: Show Swift extractor diagnostics
        if: always()
        env:
          DB: ${{ runner.temp }}/codeql_databases/swift
        run: |
          for f in "$DB"/diagnostic/extractors/swift/extractor/*.jsonl; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            head -c 20000 "$f"
            echo
            echo "::endgroup::"
          done
          if [ -d "$DB/log" ]; then
            find "$DB/log" -type f -print0 | while IFS= read -r -d '' f; do
              echo "::group::$f"
              grep -iE 'error|fatal|unsupported|fail' "$f" | head -n 200 || true
              echo "::endgroup::"
            done
          fi
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:swift"

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:actions"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:python"
