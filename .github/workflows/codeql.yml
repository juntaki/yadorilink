name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 7 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL's Rust extractor only supports build-mode `none` (source
      # analysis, no compilation) -- `manual`/`autobuild` both fail init
      # outright with "Rust does not support the manual build mode."
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          # Test code deliberately prints credentials, tokens and fixed nonces
          # in assertion messages and fixtures, which the source-level queries
          # report as cleartext logging and hard-coded cryptographic values.
          # Every refactor that moves a test re-raises them as new alerts, so
          # scan production code only.
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/tests.rs"
              - "**/*_tests.rs"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust"

  swift:
    # Analyzes the actual shipping app (project.yml's `YadoriLink` scheme --
    # a SwiftUI menu bar app, plus its FinderSync and FileProvider
    # extensions), built the standard, CodeQL-documented way for an Xcode
    # project: `xcodegen generate` then `xcodebuild`. `build.sh`'s
    # standalone `swiftc` invocation (see its own header for why it exists
    # at all -- a dev-machine constraint, not a CI one) builds a DIFFERENT,
    # non-shipping legacy host app, and CodeQL's manual-build tracer could
    # not extract anything usable from it: `database finalize` reported
    # zero Swift files processed despite the compiler tracer visibly
    # reaching every `swiftc` invocation (see this job's own history for
    # the diagnostics-dumping step that dead end produced). xcodebuild is
    # not merely a workaround for that -- it is also the CI job that was
    # never actually analyzing the shipping app's own Swift sources.
    # Pinned to a concrete label rather than `-latest`, for the usual
    # reproducibility reasons.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-06-30
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: shell-ext/macos/YadoriLinkFinderSync
        run: xcodegen generate
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
      # No signing on a CI runner with no team's certificates installed;
      # the compile cache and integrated driver are disabled because
      # CodeQL's tracer needs to observe the real compiler invocations
      # (GitHub's own Swift-analysis docs give this exact combination).
      #
      # `generic/platform=macOS`, not a concrete `platform=macOS,arch=arm64`
      # device destination -- measured on a genuinely Apple-silicon runner
      # image (`macos-15-arm64`) that xcodebuild still resolved that device
      # destination against a stale "My Mac" entry reporting arch=x86_64,
      # refusing the build outright ("My Mac doesn't support any of
      # YadoriLink.app's architectures"). The generic platform destination
      # sidesteps that device-matching step entirely; `ARCHS=arm64` below
      # (already the only value project.yml's build settings allow) still
      # decides what actually gets built.
      - name: Build the YadoriLink app + extensions
        working-directory: shell-ext/macos/YadoriLinkFinderSync
        run: |
          xcodebuild \
            -project YadoriLinkFinderSync.xcodeproj \
            -scheme YadoriLink \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            build
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:swift"

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
