name: CI full

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The five linux-full lanes below used to run as sequential steps inside
  # one job, so a slow/failing step (e.g. DST lanes) delayed the verdict on
  # every other independent lane behind it. They don't share build output or
  # mutable state -- each is a fresh `cargo test`/`cargo run` invocation --
  # so splitting them into their own jobs lets them run concurrently instead.
  # Each keeps its own Swatinem/rust-cache key so their cache writes don't
  # race or clobber each other.
  linux-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Full workspace
        # Daemon integration tests own real watcher/SQLite/network runtimes and
        # run in the linux-daemon-e2e job below. Running them here as well
        # would make several independent multi-daemon scenarios contend.
        run: cargo test --workspace --exclude yadorilink-daemon --exclude yadorilink-desktop-app

  linux-daemon-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-daemon-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Daemon E2E
        # The two monkey-chaos cases and the two topology_soak_lane cases
        # are private seed/soak coverage. They run in private beta-heat and
        # in soak-nightly.yml respectively -- see soak-nightly.yml's own
        # header comment for why a randomized, long-running test must never
        # be part of this blocking per-push gate -- while every ordinary
        # daemon integration test remains in this public, serial
        # correctness lane.
        run: >-
          cargo test -p yadorilink-daemon --tests --
          --test-threads=1
          --skip random_concurrent_operations_converge_to_an_identical_file_set
          --skip replay_known_failing_seeds
          --skip randomized_soak_converges_with_no_leaks_or_stuck_state

  linux-wire-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-wire-integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Wire integration
        run: |
          cargo test -p yadorilink-peer-session --test peer_session --test crash_recovery --test dag_two_device_wire_convergence -- --test-threads=1
          cargo test -p yadorilink-daemon --test watcher_decompose_conformance -- --test-threads=1

  linux-dst-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-dst-lanes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: DST lanes 0 and 1
        run: |
          cargo run -p xtask -- dst-lane0
          cargo run -p xtask -- dst-lane1

  linux-installer-build-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-installer-build-health
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unsigned Linux installer build-health
        run: ./installer/linux/build-deb.sh

  platform-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: platform-e2e-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Daemon E2E
        run: >-
          cargo test -p yadorilink-daemon --tests --
          --test-threads=1
          --skip random_concurrent_operations_converge_to_an_identical_file_set
          --skip replay_known_failing_seeds
          --skip randomized_soak_converges_with_no_leaks_or_stuck_state

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-06-30
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
