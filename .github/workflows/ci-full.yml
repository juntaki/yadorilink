name: CI full

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-full:
    runs-on: ubuntu-latest
    # Once "Full workspace" (below) is fully green, later steps in this
    # job (Daemon E2E, Wire integration, DST lanes, installer
    # build-health) will actually run for real for the first time --
    # give real headroom for that, matching platform-e2e's own bump.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-full
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every step below runs even if an earlier one failed
      # (`if: always()` + `continue-on-error: true`), and the final
      # "Report step failures" step fails the job overall if any of them
      # did -- so a single push surfaces every lane's failures, not just
      # the first one this job happens to reach.
      - name: Full workspace
        id: full_workspace
        continue-on-error: true
        # Daemon integration tests own real watcher/SQLite/network runtimes and
        # run in the single-threaded lane below. Running them here as well makes
        # several independent multi-daemon scenarios contend in parallel.
        #
        # --no-fail-fast: surface every failing crate's tests in one run
        # rather than stopping at the first one, so a fix doesn't have to
        # be discovered and landed one crate at a time across repeated CI
        # round-trips.
        #
        # --skip: the auth-runtime-boundaries job in CI fast owns these two
        # files, single-threaded and on their own runner. See that job.
        run: >-
          cargo test --no-fail-fast --workspace --exclude yadorilink-daemon --exclude yadorilink-desktop-app
          --
          --skip rotation_without_the_lock_destroys_the_grant
          --skip rotation_under_the_lock_keeps_the_grant_alive
          --skip rotation_child
          --skip a_process_stays_authenticated_across_the_five_minute_access_token_lifetime
      - name: Path-frontier scale bounds (release)
        id: path_frontier_scale
        if: always()
        continue-on-error: true
        # The absolute per-admission bound in this file is a release-build
        # figure; the debug run above checks only that the cost stays flat.
        run: cargo test --release -p yadorilink-sync-sqlite --test path_frontier_scale
      # tests/release_manifest_chain.rs drives the Python manifest verifier,
      # which needs the cryptography package. setup-python gives a Python
      # that pip may install into (the runner images' own may not allow it).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: "3.12"
      - name: Python cryptography for the release manifest chain test
        if: always()
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography
      - name: Daemon E2E
        id: daemon_e2e
        if: always()
        continue-on-error: true
        # The two monkey-chaos cases are long-running seed/soak coverage and
        # are skipped here; every ordinary daemon integration test runs in
        # this serial correctness lane.
        #
        # Deliberately WITHOUT --no-fail-fast: this is roughly 90 separate
        # test binaries run serially, so the lane stops at the first failing
        # binary and reports it quickly rather than spending the full
        # suite's runtime on every push.
        run: >-
          cargo test -p yadorilink-daemon --tests --
          --test-threads=1
          --skip random_concurrent_operations_converge_to_an_identical_file_set
          --skip replay_known_failing_seeds
      - name: Wire integration
        id: wire_integration
        if: always()
        continue-on-error: true
        run: |
          cargo test --no-fail-fast -p yadorilink-peer-session --test peer_session --test crash_recovery -- --test-threads=1
          cargo test --no-fail-fast -p yadorilink-daemon --test watcher_decompose_conformance -- --test-threads=1
      - name: DST lanes 0 and 1
        id: dst_lanes
        if: always()
        continue-on-error: true
        run: |
          cargo run -p xtask -- dst-lane0
          cargo run -p xtask -- dst-lane1
      - name: Unsigned Linux installer build-health
        id: installer_build_health
        if: always()
        continue-on-error: true
        run: ./installer/linux/build-deb.sh
      - name: Report step failures
        if: always()
        run: |
          failed=0
          for outcome in \
            "${{ steps.full_workspace.outcome }}" \
            "${{ steps.path_frontier_scale.outcome }}" \
            "${{ steps.daemon_e2e.outcome }}" \
            "${{ steps.wire_integration.outcome }}" \
            "${{ steps.dst_lanes.outcome }}" \
            "${{ steps.installer_build_health.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "one or more steps in this job failed; see above for which"
            exit 1
          fi

  platform-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-06-30
        with:
          toolchain: stable
      # tests/release_manifest_chain.rs drives the Python manifest verifier,
      # which needs the cryptography package. setup-python gives a Python
      # that pip may install into (the runner images' own may not allow it).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python cryptography for the release manifest chain test
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography
      - name: Daemon E2E
        # Deliberately WITHOUT --no-fail-fast: see linux-full's own Daemon
        # E2E step for why -- this is the same serial multi-binary suite.
        run: >-
          cargo test -p yadorilink-daemon --tests --
          --test-threads=1
          --skip random_concurrent_operations_converge_to_an_identical_file_set
          --skip replay_known_failing_seeds

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-06-30
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
