name: Nightly

# Statistical confidence rather than per-SHA truth: multi-seed simulation,
# chaos, and coverage measurement. Deterministic correctness lives in
# verify.yml.

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  simulation-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nightly-simulation
          token: ${{ github.token }}
      # DST_SEEDS unset: each scenario runs its own default sweep.
      - name: Turmoil sweeps
        env:
          RUSTFLAGS: --cfg turmoil
        run: >-
          cargo test --no-fail-fast -p yadorilink-daemon
          --test dst_turmoil_substrate_case
          -- --test-threads=1
      - if: always()
        run: cargo run -p xtask -- dst-lane2

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nightly-chaos
          token: ${{ github.token }}
      - run: >-
          cargo test -p yadorilink-daemon --test monkey_chaos
          -- --test-threads=1

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: nightly-coverage
          components: llvm-tools-preview
          token: ${{ github.token }}
      - run: cargo install --locked --version 0.8.7 cargo-llvm-cov
      - run: cargo llvm-cov clean --workspace
      - name: Workspace coverage
        run: cargo llvm-cov --no-fail-fast --workspace --exclude yadorilink-daemon --exclude yadorilink-desktop-app --no-report
      - name: Daemon coverage (serial)
        if: always()
        run: |
          cargo llvm-cov --no-fail-fast -p yadorilink-daemon --tests --no-report -- \
            --test-threads=1 \
            --skip random_concurrent_operations_converge_to_an_identical_file_set \
            --skip replay_known_failing_seeds
      - if: always()
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          disable_search: true
          fail_ci_if_error: true
