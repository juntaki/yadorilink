name: Soak nightly

# M5-A Pass 10: the randomized multi-node soak lane
# (crates/yadorilink-daemon/tests/topology_soak_lane.rs) is deliberately
# NOT part of ci-fast.yml/ci-full.yml's per-push gate -- it is randomized/
# long-running by design (topology_soak_lane.rs's own module doc comment),
# matching how monkey_chaos.rs's own randomized cases are excluded from
# ci-full.yml's linux-daemon-e2e/platform-e2e jobs via --skip and run
# separately instead. This lane is scheduled nightly plus available on
# demand, never blocking an ordinary PR/push.
#
# Both soak tests were UNIGNORED once the soak-closure investigation's
# findings (session leak, stale route, durability-stuck x2) were all
# fixed and verified -- see the tracked comment on
# randomized_soak_converges_with_no_leaks_or_stuck_state in
# topology_soak_lane.rs. Both steps below therefore run WITHOUT
# `--ignored`: that flag runs *only* ignored tests, so leaving it on a
# no-longer-ignored test matches zero tests and silently exits 0 --
# exactly the kind of "always green" nightly this lane exists to
# prevent. If either test ever needs to go back to `#[ignore]` for a
# real, tracked reason, this workflow's own invocation must be updated
# in the SAME change, not left stale.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      soak_duration_secs:
        description: "SOAK_DURATION_SECS for the randomized run (default 20s if unset)"
        required: false
        default: "1800"

permissions:
  contents: read

concurrency:
  group: soak-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  soak-lane:
    runs-on: ubuntu-latest
    # A manual dispatch can ask for a much longer SOAK_DURATION_SECS than
    # the scheduled nightly default, so this budget is generous rather
    # than tied tightly to any one duration.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-06-30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: soak-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Randomized soak (fresh seed)
        env:
          SOAK_DURATION_SECS: ${{ github.event.inputs.soak_duration_secs || '1800' }}
        run: cargo test -p yadorilink-daemon --test topology_soak_lane randomized_soak -- --nocapture
      - name: Replay known-failing corpus seeds
        if: always()
        run: cargo test -p yadorilink-daemon --test topology_soak_lane replay_known_failing_seeds -- --nocapture
      - name: Upload corpus if it changed
        # A failing run appends a fresh seed to tests/dst_corpus/soak_lane_seeds.txt
        # locally in the runner's checkout -- surface it as an artifact so a
        # human can pull the new seed into a real commit, mirroring how
        # monkey_chaos.rs's own corpus growth is meant to be handled (never
        # auto-committed from CI).
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-lane-corpus
          path: crates/yadorilink-daemon/tests/dst_corpus/soak_lane_seeds.txt
          if-no-files-found: ignore
