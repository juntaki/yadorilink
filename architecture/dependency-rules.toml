# Architecture boundary rules, layered over the generated dependency graphs
# (see architecture/scripts/generate-all.sh). This file is the source of
# truth for the color overlay in
# architecture/graphs/generated/dependency-boundaries.dot -- it is not
# enforced at build time. scripts/check-phase1b-application-boundary.py is
# the (narrower, string-pattern) enforcement mechanism for the CLI and
# control_socket boundaries; scripts/check-daemon-application-dependencies.py
# enforces the `application` rules below directly (both run in CI).
#
# `from` and `to` match node names in the crate graph (workspace crate
# names, e.g. "yadorilink-cli") or the module coupling graphs
# ("<crate>::<top-level-module>", e.g. "yadorilink-daemon::application").
# `to` is a prefix match against the edge target.
#
# `deny`   -> edge rendered red: this dependency direction must not exist.
# `allow`  -> edge rendered blue: this dependency direction is intended.
# `known_violation` -> edge rendered yellow: currently present, currently
#             tolerated, tracked for future removal.
# Edges matching no rule are rendered gray (unclassified).

[[rule]]
from = "yadorilink-cli"
deny = ["yadorilink-daemon::application", "yadorilink-daemon::coordination_client"]

[[rule]]
from = "yadorilink-cli"
allow = ["yadorilink-daemon"]

[[rule]]
from = "yadorilink-daemon::application"
deny = [
    "yadorilink_ipc_proto",
    "yadorilink-daemon::daemon_state",
    "yadorilink-daemon::coordination_client",
    "yadorilink-daemon::control_socket",
    "yadorilink-daemon::hydration",
    "yadorilink-daemon::link_manager",
    "yadorilink-daemon::peer_registry",
    "yadorilink-daemon::link_registry",
    "yadorilink-daemon::durability_service",
    "yadorilink-daemon::runtime_telemetry",
    "yadorilink-daemon::maintenance_coordinator",
]

[[rule]]
from = "yadorilink-daemon::control_socket"
allow = ["yadorilink-daemon::application", "yadorilink-daemon::recovery_diagnosis"]
