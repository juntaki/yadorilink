# Phase 7D-9F per-method ledger for `SyncState`
#
# Machine-checkable inventory of every pub/pub(crate) method on `SyncState`
# (the `impl SyncState { ... }` block in
# `crates/yadorilink-sync-core/src/index.rs`, lines 224-3217 as of this pass).
# Mirrors the structure/discipline of
# `docs/design/phase7d9-sync-core-residual-ledger.toml` -- a per-file ledger --
# but at per-method granularity, since 7D-9F's whole job is retiring the
# `SyncState` facade method by method, not file by file.
#
# Scope note: `SyncState` also gains two smaller `impl SyncState { ... }`
# blocks elsewhere (`index/rebootstrap_store/base.rs`,
# `index/rebootstrap_store/retroactive_conflict_store.rs`). The first pass
# left these two files' methods out (charter was `index.rs` itself); this
# second pass folded their 8 methods in as their own `` entries
# (see the addendum block near the end of this file) with an explicit `path`
# key distinguishing them from the `index.rs`-implied default. The gate
# script's `index_rs_production_lines` metric is still `index.rs`-only by
# design (these two files are not `index.rs`), but `syncstate_production_
# methods`/`syncstate_non_delegation_methods` now cover all 213 known
# `SyncState` inherent methods workspace-wide (205 + 8), not just the 205 in
# `index.rs`.
#
# `category` is one of: delegation, composition, business logic, SQLite,
# filesystem, test-only, dead.
#
# `production_callers` is a file-count of non-test call sites found by
# `rg -l` against `.method_name(` (or `::method_name(` for the two
# associated functions, `open`/`open_in_memory`) across `crates/` and
# `daemon/`. It is a heuristic, not an exact call-graph count -- common
# method names can collide with unrelated identically-named methods on other
# types, and the pattern does not distinguish real callers from ones inside
# `#[cfg(test)]` blocks in an otherwise-production file. Treat it as
# "probably nonzero" / "probably zero", not ground truth -- exact counts,
# where they matter for a migration decision, should be reverified with a
# real reference search at that time, per this initiative's own recurring
# lesson that ledger claims need fresh verification, not inheritance.
#
# `status` is "pending" (not yet migrated) or "migrated" (destination code
# exists and every real caller is repointed) -- same vocabulary as the main
# residual ledger. Every entry in this pass is "pending": no `SyncState`
# method was migrated this pass (see `phase7d9f-exit-report.md` for why).

