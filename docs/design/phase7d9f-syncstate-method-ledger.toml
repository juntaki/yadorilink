# --- Second pass addendum: the two `impl SyncState` blocks OUTSIDE index.rs
# the first pass flagged as a known scope gap (exit report S2/S5 item 1) ---
# `crates/yadorilink-sync-core/src/index/rebootstrap_store/base.rs` (7
# methods) and
# `crates/yadorilink-sync-core/src/index/rebootstrap_store/retroactive_conflict_store.rs`
# (1 method). Folded into this same ledger, same schema, so the gate's
# `syncstate_production_methods` metric can eventually cover every
# `SyncState` inherent method workspace-wide, not just `index.rs`'s own --
# the gate script's `index_rs_production_lines` metric itself stays scoped to
# `index.rs` alone (these two files are not `index.rs`), but the per-method
# ledger below is now complete. None of the 8 were migrated this pass.
#
# The `base.rs` six-method group is a thin `self.database.read/write_immediate(
# |conn| yadorilink_sync_sqlite::rebootstrap_store::<free fn>(conn, ...))`
# wrapper layer (see that file's own module doc comment: the SQL/traversal
# logic already moved to `yadorilink-sync-sqlite` in 7D-9D). Migrating any of
# these six would mean exposing an accessor for the private `self.database:
# Arc<SyncDatabase>` field (or a narrower `rebootstrap_store`-scoped
# accessor) -- deferred to a future pass since `self.database` also backs
# dozens of OTHER still-pending `index.rs` delegation methods not touched
# this pass, and a single-purpose accessor for only these six would be a
# narrower cut than the field's real shared usage.
#
# `install_rebootstrap_snapshot` is `composition`, not pure `delegation`: it
# resolves `self.local_emission_auth(...)` (itself an in-crate composition
# call) BEFORE opening the transaction, then passes the already-snapshotted
# auth value into the moved module -- real per-call sequencing logic, not a
# single forward.
#
# `repair_retroactive_conflict_copy_obligations` (the
# `retroactive_conflict_store.rs` file's only method) is `business logic`:
# election-context resolution, a live-auth re-check race guard taken twice
# inside the same transaction, and multi-way outcome branching -- exactly the
# kind of real per-call orchestration the ledger's existing single
# `business logic` entry (`absent_gate_verdict`) also has, not a thin
# forward.

