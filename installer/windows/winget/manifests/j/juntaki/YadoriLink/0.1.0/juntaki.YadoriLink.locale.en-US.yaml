ShortDescription: Local-first peer-to-peer folder sync
Description: >-
  YadoriLink synchronizes folders directly between your own devices over a
  peer-to-peer connection, with no server ever holding your file data. This
  installer includes the yadorilink CLI, the sync daemon, the menu-bar
  status app, and Windows Explorer shell integration (Cloud Filter API
  placeholder/on-demand files, right-click sharing).
